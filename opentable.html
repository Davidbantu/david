<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kitchen — Open Tables</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Montserrat:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <style>
    :root{
      --main-bg: linear-gradient(135deg, #0d47a1 0%, #000000 100%);
      --card-bg: #000000; /* changed to solid black per request */
      --card-border: rgba(255,255,255,0.04);
      --accent: #bbdefb;
      --primary: #42a5f5;
      --accent2: #263859;
      --success: #43a047;
      --warning: #ffb300;
      --danger: #e53935;
      --muted: #9aa8c0;
      --glass-blur: 8px;
    }

    * { box-sizing: border-box; }
    html,body { height:100%; margin:0; font-family:"Poppins",sans-serif; color:#fff; background:var(--main-bg); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }

    .wrap { max-width:1200px; width:100%; margin:0 auto; padding:22px; min-height:100vh; display:flex; flex-direction:column; gap:18px; }

    .topbar { display:flex; align-items:center; gap:12px; }
    .title { font-weight:700; color:var(--accent); font-size:1.3rem; display:flex; align-items:center; gap:10px; }
    .controls { margin-left:auto; display:flex; gap:12px; align-items:center; }

    .btn { background:var(--primary); color:#fff; border:0; padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:700; box-shadow:0 4px 14px rgba(66,165,245,0.12); }
    .ghost { background:transparent; border:1px solid rgba(255,255,255,0.06); padding:8px 10px; border-radius:8px; color:var(--accent); }

    /* Open count with pulsing glow */
    .open-count {
      display:flex;
      align-items:center;
      gap:8px;
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      padding:8px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.04);
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      position:relative;
    }
    .open-count .badge {
      background:var(--primary);
      color:#fff;
      padding:6px 10px;
      border-radius:999px;
      font-weight:900;
      font-size:0.95rem;
      box-shadow: 0 6px 18px rgba(66,165,245,0.18);
      position:relative;
      z-index:2;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .open-count .badge.pulse {
      animation: pulseGlow 1600ms infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(66,165,245,0.28); }
      50% { box-shadow: 0 0 18px 6px rgba(66,165,245,0.10); transform: translateY(-1px); }
      100% { box-shadow: 0 0 0 0 rgba(66,165,245,0.00); transform: translateY(0); }
    }

    /* Grid responsive: 5..1 columns */
    .grid {
      display:grid;
      gap:14px;
      grid-auto-rows: minmax(120px, auto);
    }
    @media (min-width:1400px){ .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width:1100px) and (max-width:1399px){ .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width:800px) and (max-width:1099px){ .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width:480px) and (max-width:799px){ .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width:479px){ .grid { grid-template-columns: repeat(1, 1fr); } }

    /* Glass morphism card (background changed to black) */
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      position:relative;
      overflow: hidden;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      transition: transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .18s ease, border-color .18s ease;
      cursor: pointer;
      opacity: 0;
      transform: translateY(18px) scale(0.995);
    }

    /* animated entrance (we will stagger via inline delay) */
    .table-card.enter {
      animation: fadeInUp .42s forwards cubic-bezier(.2,.9,.3,1);
    }
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* subtle hover + glow */
    .table-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(66,165,245,0.12);
      box-shadow: 0 18px 50px rgba(2,6,23,0.6), 0 6px 18px rgba(66,165,245,0.06);
    }
    .table-card:active { transform: translateY(-3px) scale(1.008); }

    /* Sheen */
    .table-card::after {
      content: "";
      position: absolute;
      left: -40%;
      top: -20%;
      width: 60%;
      height: 140%;
      background: linear-gradient(120deg, rgba(255,255,255,0.02), rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      transform: rotate(-18deg);
      pointer-events:none;
      transition: left .45s ease;
      opacity:0.45;
      mix-blend-mode: overlay;
      backdrop-filter: blur(0px);
    }
    .table-card:hover::after { left: 120%; opacity:0.9; }

    /* content layout */
    .table-number {
      font-family: "Montserrat", "Poppins", sans-serif;
      font-weight: 900;
      font-size: 2.2rem; /* big as requested */
      color: var(--accent);
      line-height: 1;
      margin: 0;
      word-break: normal;
      white-space: normal; /* allow wrap to next lines for remaining info below */
    }

    .table-sub {
      display:flex;
      flex-direction:column;
      gap:6px;
      font-size:0.95rem;
      color:var(--muted);
    }

    .meta-row {
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }

    /* smaller text for order number and items */
    .meta-item {
      background: rgba(255,255,255,0.02);
      color:var(--muted);
      padding:6px 8px;
      border-radius:8px;
      font-weight:700;
      font-size:0.78rem; /* made small */
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .status-paid { color:var(--success); background: rgba(67,160,71,0.08); border:1px solid rgba(67,160,71,0.06); }
    .status-pending { color:var(--warning); background: rgba(255,165,0,0.06); border:1px solid rgba(255,165,0,0.06); }
    .status-completed { color:var(--muted); background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.03); }

    .timer {
      font-weight:800;
      color:var(--primary);
      background: rgba(66,165,245,0.04);
      padding:6px 8px;
      border-radius:8px;
      min-width:92px;
      text-align:center;
      font-size:0.95rem;
    }

    .small-muted { color:var(--muted); font-size:0.9rem; }

    /* keep long text from overflowing card, allow wrap in metadata lines */
    .meta-item, .table-sub { overflow-wrap: anywhere; word-break: break-word; }

    /* compact on very small screens */
    @media (max-width:380px){
      .table-number { font-size:1.6rem; }
      .timer { min-width:76px; font-size:0.86rem; }
      .meta-item { font-size:0.72rem; padding:5px 6px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title"><i class="fas fa-table"></i> Open Tables</div>
      <div class="controls">
        <div id="todayDate" class="small-muted"></div>
        <button id="refreshBtn" class="btn"><i class="fas fa-sync"></i> Refresh</button>

        <div class="open-count" title="Open tables">
          <div style="color:var(--muted);font-weight:700;margin-right:6px;">Open tables</div>
          <div id="openCountBadge" class="badge pulse">0</div>
        </div>
      </div>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>

    <div id="empty" class="small-muted" style="display:none;margin-top:8px;text-align:center;font-weight:700;">No open tables now.</div>

    <div style="margin-top:6px;color:var(--muted);">Click a table to open the Kitchen screen (home.html). The view will be filtered to that table/order.</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    // Firebase config (same as home)
    const firebaseConfig = {
      apiKey: "AIzaSyBZCm8Fmp-zNlb2D20gqLCyifky-hGtZvI",
      authDomain: "newpos-dacb5.firebaseapp.com",
      databaseURL: "https://newpos-dacb5-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "newpos-dacb5",
      storageBucket: "newpos-dacb5.appspot.com",
      messagingSenderId: "667100253940",
      appId: "1:667100253940:web:cfd8f0b9b51b6e697818a1",
      measurementId: "G-F5Q2JCNJ10"
    };
    firebase.initializeApp(firebaseConfig);

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const refreshBtn = document.getElementById('refreshBtn');
    const todayDateEl = document.getElementById('todayDate');
    const openCountBadge = document.getElementById('openCountBadge');

    function todayDateStr(){ return (new Date()).toISOString().slice(0,10); }
    todayDateEl.textContent = todayDateStr();

    // State
    let tablesMap = {}; // table -> [orders]
    let tableTimers = {}; // table -> intervalId

    function statusIsCompleted(s){ if(!s) return false; return String(s).toLowerCase() === 'completed'; }

    function normalizeTable(t){
      if(t === null || typeof t === 'undefined') return null;
      return String(t).trim();
    }

    function parseOrderCreatedAt(o){
      if(!o) return Date.now();
      if(o.createdAt) return Number(o.createdAt);
      if(o.date && o.time){
        const d = new Date(o.date + 'T' + (o.time || '00:00:00'));
        if(!isNaN(d.getTime())) return d.getTime();
      }
      return Date.now();
    }

    // create or update card timers for each table: show elapsed since earliest pending order
    function startTableTimer(table, el, earliestCreatedAt){
      stopTableTimer(table);
      function update(){
        const now = Date.now();
        const secs = Math.floor((now - earliestCreatedAt)/1000);
        const hh = String(Math.floor(secs/3600)).padStart(2,'0');
        const mm = String(Math.floor((secs%3600)/60)).padStart(2,'0');
        const ss = String(secs%60).padStart(2,'0');
        el.textContent = `${hh}:${mm}:${ss}`;
      }
      update();
      tableTimers[table] = setInterval(update, 1000);
    }
    function stopTableTimer(table){
      if(tableTimers[table]){ clearInterval(tableTimers[table]); delete tableTimers[table]; }
    }

    function countItems(order){
      if(!order || !Array.isArray(order.items)) return 0;
      let total = 0;
      for(const it of order.items){
        if(typeof it.qty !== 'undefined' && !isNaN(Number(it.qty))) total += Number(it.qty);
        else total += 1;
      }
      return total;
    }

    function buildCardForTable(table, orders, index){
      // orders are expected sorted by earliest createdAt first
      const first = orders[0];
      const card = document.createElement('div');
      card.className = 'table-card enter';
      // staggered entrance
      card.style.animationDelay = (index * 65) + 'ms';
      card.tabIndex = 0;
      card.setAttribute('role','button');

      // table number (big)
      const tnum = document.createElement('div');
      tnum.className = 'table-number';
      tnum.textContent = String(table).toUpperCase();
      card.appendChild(tnum);

      // sub info: small order number + small items, timer in next row, payment status at last line
      const sub = document.createElement('div');
      sub.className = 'table-sub';

      // first meta row (order # and items) - small text
      const row1 = document.createElement('div');
      row1.className = 'meta-row';
      const orderNum = document.createElement('div');
      orderNum.className = 'meta-item';
      orderNum.textContent = 'Order #' + (first.id || first.key || '');
      row1.appendChild(orderNum);

      const itemsEl = document.createElement('div');
      itemsEl.className = 'meta-item';
      itemsEl.textContent = (countItems(first) || 0) + ' items';
      row1.appendChild(itemsEl);

      sub.appendChild(row1);

      // second row: timer only (no time)
      const row2 = document.createElement('div');
      row2.className = 'meta-row';
      const timerEl = document.createElement('div');
      timerEl.className = 'timer';
      timerEl.textContent = '00:00:00';
      // push timer to the left while leaving space for wrapping below
      row2.appendChild(timerEl);
      sub.appendChild(row2);

      // third row: payment status on last line
      const row3 = document.createElement('div');
      row3.className = 'meta-row';
      const status = (first.status || '').toString().toLowerCase();
      const statusEl = document.createElement('div');
      statusEl.className = 'meta-item';
      if(status === 'paid') {
        statusEl.classList.add('status-paid');
        statusEl.textContent = 'Paid';
      } else if(status === 'completed') {
        statusEl.classList.add('status-completed');
        statusEl.textContent = 'Completed';
      } else {
        statusEl.classList.add('status-pending');
        statusEl.textContent = first.paymentStatus ? String(first.paymentStatus) : 'Payment Pending';
      }
      row3.appendChild(statusEl);
      sub.appendChild(row3);

      card.appendChild(sub);

      // scheduled note if present
      if(first.scheduledTime){
        const scheduled = document.createElement('div');
        scheduled.className = 'small-muted';
        scheduled.style.marginTop = '6px';
        scheduled.textContent = 'Scheduled: ' + String(first.scheduledTime);
        card.appendChild(scheduled);
      }

      // click -> open home.html and set localStorage hint
      card.addEventListener('click', ()=> openHomeForTable(table, orders));
      card.addEventListener('keypress', (e)=> { if(e.key === 'Enter' || e.key === ' ') openHomeForTable(table, orders); });

      // start/refresh table timer using earliest order createdAt
      const earliestCreated = parseOrderCreatedAt(first);
      startTableTimer(table, timerEl, earliestCreated);

      return card;
    }

    function openHomeForTable(table, orders){
      const orderId = (orders && orders.length) ? (orders[0].id || orders[0].key || '') : '';
      try {
        localStorage.setItem('kitchen_target_table', String(table));
        if(orderId) localStorage.setItem('kitchen_target_order', String(orderId));
      } catch(e){}
      const url = 'home.html?table=' + encodeURIComponent(String(table)) + (orderId ? ('&order=' + encodeURIComponent(String(orderId))) : '');
      window.location.href = url;
    }

    // render grid
    function renderGrid(){
      const currentTables = Object.keys(tablesMap);

      // stop timers for tables removed
      Object.keys(tableTimers).forEach(t => {
        if(!currentTables.includes(t)) stopTableTimer(t);
      });

      grid.innerHTML = '';
      const entries = Object.keys(tablesMap).sort((a,b)=>{
        const na = parseFloat(a), nb = parseFloat(b);
        if(!isNaN(na) && !isNaN(nb)) return na - nb;
        return String(a).localeCompare(String(b));
      });

      if(entries.length === 0){
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
      }

      entries.forEach((t, i) => {
        const card = buildCardForTable(t, tablesMap[t], i);
        grid.appendChild(card);
      });

      openCountBadge.textContent = entries.length;
      if(entries.length > 0) openCountBadge.classList.add('pulse');
      else openCountBadge.classList.remove('pulse');
    }

    // helper: group pending orders (not completed) per table for today
    function updateTablesFromOrders(ordersObj){
      const map = {};
      const today = todayDateStr();
      const keys = Object.keys(ordersObj || {});
      keys.forEach(k => {
        const o = ordersObj[k];
        if(!o) return;
        const status = o.status;
        if(statusIsCompleted(status)) return; // skip completed
        const table = normalizeTable(o.table);
        if(!table) return;
        // enforce today's orders (like home.html)
        if(o.date && o.date !== today) return;
        const entry = Object.assign({}, o);
        entry.key = k;
        entry.id = o.id || k;
        // ensure createdAt
        if(!entry.createdAt){
          entry.createdAt = entry.createdAt || (entry.date ? parseOrderCreatedAt(entry) : Date.now());
        }
        if(!map[table]) map[table] = [];
        map[table].push(entry);
      });

      // sort orders per table by createdAt (earliest first)
      Object.keys(map).forEach(t => {
        map[t].sort((a,b)=> (Number(a.createdAt)||0) - (Number(b.createdAt)||0));
      });

      // stop timers on tables that will be removed
      Object.keys(tableTimers).forEach(t => { if(!map[t]) stopTableTimer(t); });

      tablesMap = map;
      renderGrid();
    }

    // realtime listener
    const ref = firebase.database().ref('orders');
    ref.on('value', snap => {
      const val = snap.val() || {};
      updateTablesFromOrders(val);
    }, err => { console.error('Firebase error', err); });

    // manual refresh
    refreshBtn.addEventListener('click', ()=> {
      firebase.database().ref('orders').once('value').then(snap => {
        updateTablesFromOrders(snap.val() || {});
      }).catch(err => console.error(err));
    });

    // initial load (in case on->value hasn't fired)
    firebase.database().ref('orders').once('value').then(snap => {
      updateTablesFromOrders(snap.val() || {});
    }).catch(err => console.error(err));

    // cleanup timers when leaving
    window.addEventListener('beforeunload', () => {
      Object.keys(tableTimers).forEach(t => stopTableTimer(t));
    });
  </script>
</body>
</html>
